name: Apply field vision patch v3

on:
  push:
    branches:
      - ui/mobile-responsive-port-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/mobile-responsive-port-20260912
          fetch-depth: 0

      - name: Align patch with current spec text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-field-vision-patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'old = "山・高低差による視界遮蔽は現在行わない。"',
              'old = "現在は山、高低差、森、天候による視界遮蔽と、他勢力との視界共有を行わない。各勢力の村、ユニット、所有する索敵施設だけで現在視界を計算する。"'
          )
          text = text.replace(
              '"フィールド表示用の視界にはゲーム設定の追加マス（既定+2）を加え、`heightLevelMap` の中間高度が視線より高い場合はその奥を遮蔽する。索敵・敵発見距離は従来の `1 + floor(索敵/75)` のまま広げない。",',
              '"山・高低差はフィールド表示用視界の遮蔽に使用し、ゲーム設定の追加マス（既定+2）を加えた範囲でも `heightLevelMap` の中間高度が視線より高い場合はその奥を隠す。森・天候による視界遮蔽と他勢力との視界共有は現在行わない。各勢力の村、ユニット、所有する索敵施設だけで現在視界を計算し、索敵・敵発見距離は従来の `1 + floor(索敵/75)` のまま広げない。",'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply patch
        run: python scripts/apply-field-vision-patch.py

      - name: Remove this one-shot workflow
        run: rm -f .github/workflows/apply-field-vision-patch-v3.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:front

      - name: Verify patch invariants
        run: |
          grep -F 'fieldVisionBonusTiles' frontend/src/components/PhaserMapGeneratorPanel.vue
          grep -F 'addV39FieldVisionRangeKeys' frontend/src/components/PhaserMapGeneratorPanel.vue
          grep -F 'const playerInRange = distance <= playerVisionRange;' frontend/src/components/PhaserMapGeneratorPanel.vue
          grep -F 'フィールド視界追加マス' config/player_config_options.json
          grep -F 'heightLevelMap' frontend/src/lib/v39-field-visibility.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: extend field vision without extending detection"
          git push origin HEAD:ui/mobile-responsive-port-20260912
