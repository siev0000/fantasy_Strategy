name: temporary-cleanup-spec-bug-fix

on:
  push:
    branches:
      - fix/spec-bugs-20260911
    paths:
      - .github/workflows/cleanup-spec-bug-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spec-bugs-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Restore generated output to main state
        shell: bash
        run: |
          git fetch origin main
          git rm -r --ignore-unmatch web-vue-dist
          git checkout origin/main -- web-vue-dist
          rm -f .github/workflows/cleanup-spec-bug-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated build artifacts from fix"
          git push origin HEAD:fix/spec-bugs-20260911
