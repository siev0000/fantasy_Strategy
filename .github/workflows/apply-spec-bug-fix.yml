name: temporary-spec-bug-fix

on:
  push:
    branches:
      - fix/spec-bugs-20260911

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spec-bugs-20260911
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply targeted fixes
        run: python .github/scripts/apply_spec_bug_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:front

      - name: Commit validated fixes
        shell: bash
        run: |
          rm -f .github/workflows/apply-spec-bug-fix.yml
          rm -f .github/scripts/apply_spec_bug_fix.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align squad city and facility rules"
          git push origin HEAD:fix/spec-bugs-20260911
