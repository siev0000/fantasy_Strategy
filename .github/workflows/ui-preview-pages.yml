name: UI Preview Pages

on:
  push:
    branches:
      - ui/mobile-responsive-port-20260912
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ui-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply settings and field vision fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('frontend/src/components/PhaserMapGeneratorPanel.vue')
          text = panel.read_text(encoding='utf-8')

          wrong_block = '''  {
            key: "section_game",
            kind: "header",
            label: "ゲーム設定"
          },
          {
            key: "fieldVisionBonusTiles",
            kind: "number",
            label: "フィールド視界追加マス",
            value: gameStartSettings.value?.fieldVisionBonusTiles ?? 2,
            min: GAME_START_FIELD_VISION_BONUS_MIN,
            max: GAME_START_FIELD_VISION_BONUS_MAX,
            step: 1,
            help: "地形を見渡せる範囲だけを追加します。索敵・敵発見距離は広がらず、高低差で遮られます。"
          },
          '''
          if wrong_block in text:
              text = text.replace(wrong_block, '', 1)

          text = text.replace(
              'if (key === "section_game" || key === "section_display" || key === "section_audio") return;',
              'if (key === "section_display" || key === "section_audio") return;',
              1
          )
          text = text.replace(
              '@click="openDisplaySettingsFromQuickMenu">ゲーム設定</button>',
              '@click="openDisplaySettingsFromQuickMenu">音量/表示設定</button>',
              1
          )
          text = text.replace(
              'v-model="showSettingsModal"\n      title="ゲーム設定"',
              'v-model="showSettingsModal"\n      title="表示設定"',
              1
          )

          old_resolver = '''function resolveFieldVisionBonusTiles() {
            return normalizeFieldVisionBonusTiles(gameStartSettings.value?.fieldVisionBonusTiles);
          }'''
          new_resolver = '''function resolveFieldVisionBonusTiles() {
            const runtimeSettings = typeof window !== "undefined" && typeof window.getV39GameSettings === "function"
              ? window.getV39GameSettings()
              : null;
            return normalizeFieldVisionBonusTiles(
              runtimeSettings?.fieldVisionBonusTiles ?? gameStartSettings.value?.fieldVisionBonusTiles
            );
          }'''
          if old_resolver in text:
              text = text.replace(old_resolver, new_resolver, 1)
          elif new_resolver not in text:
              raise SystemExit('resolveFieldVisionBonusTiles target not found')

          marker = '''function drawScoutRangeBoundaryOverlay(data, scoutRangeTileKeys, graphics, wrapOffsets) {'''
          refresh = '''function refreshFieldVisionFromGameSettings() {
            if (typeof window !== "undefined" && typeof window.getV39GameSettings === "function") {
              gameStartSettings.value = normalizeGameStartSettings(window.getV39GameSettings());
            }
            if (!currentData.value?.grid) return false;
            rebuildVisibleTiles(currentData.value);
            requestMapRender();
            return true;
          }

          if (typeof window !== "undefined") {
            window.refreshV39FieldVisionFromGameSettings = refreshFieldVisionFromGameSettings;
          }

          '''
          if refresh not in text:
              if marker not in text:
                  raise SystemExit('field vision refresh insertion target not found')
              text = text.replace(marker, refresh + marker, 1)

          panel.write_text(text, encoding='utf-8')

          save = Path('frontend/src/v39/core/v39-save-system.js')
          text = save.read_text(encoding='utf-8')

          import_line = '''import {normalizeV39RecoveryWaitPercent,updateV39RecoveryWaitSettings} from '../../lib/v39-recovery-wait.js';'''
          settings_import = '''import { GAME_START_FIELD_VISION_BONUS_MAX, GAME_START_FIELD_VISION_BONUS_MIN, normalizeFieldVisionBonusTiles, normalizeGameStartSettings } from '../../lib/game-start-settings.js';'''
          if settings_import not in text:
              if import_line not in text:
                  raise SystemExit('save-system import target not found')
              text = text.replace(import_line, import_line + '\n' + settings_import, 1)

          recovery_section = '''    <section><h3>回復まで待機</h3>
              <label>待機を終えるHP <input id="v39-recovery-wait-percent" type="number" min="1" max="100" step="1" aria-label="回復待機の目標HP率"> %</label>
              <p>基本行動の「回復まで待機」で使用します。初期値100%。変更は待機中のユニットにも適用され、セーブに保存されます。</p>
            </section>
          '''
          vision_section = '''    <section><h3>フィールド視界</h3>
              <label>追加マス <input id="v39-field-vision-bonus" type="number" min="${GAME_START_FIELD_VISION_BONUS_MIN}" max="${GAME_START_FIELD_VISION_BONUS_MAX}" step="1" aria-label="フィールド視界追加マス"> マス</label>
              <p>地形を見渡せる範囲だけを追加します。初期値2マス。索敵・敵発見距離は広がらず、高低差で視界が遮られます。</p>
            </section>
          '''
          if vision_section not in text:
              if recovery_section not in text:
                  raise SystemExit('settings UI insertion target not found')
              text = text.replace(recovery_section, recovery_section + vision_section, 1)

          old_decls = '''  const recoveryInput = document.getElementById('v39-recovery-wait-percent');'''
          new_decls = '''  const recoveryInput = document.getElementById('v39-recovery-wait-percent');
            const fieldVisionInput = document.getElementById('v39-field-vision-bonus');'''
          if new_decls not in text:
              if old_decls not in text:
                  raise SystemExit('settings input declaration target not found')
              text = text.replace(old_decls, new_decls, 1)

          recovery_sync = '''  syncRecoverySetting();
            recoveryInput.addEventListener('change',()=>{'''
          combined_sync = '''  const syncFieldVisionSetting = () => {
              if (!(fieldVisionInput instanceof HTMLInputElement)) return;
              if (document.activeElement !== fieldVisionInput) {
                fieldVisionInput.value = String(normalizeFieldVisionBonusTiles(window.getV39GameSettings?.()?.fieldVisionBonusTiles));
              }
            };
            syncRecoverySetting();
            syncFieldVisionSetting();
            fieldVisionInput?.addEventListener('change',()=>{
              const state = window.getV39GameState?.({includeWorlds:false});
              if (!state || window.isV39MapInputLocked?.()) return;
              const nextSettings = normalizeGameStartSettings({
                ...state.gameSettings,
                fieldVisionBonusTiles: fieldVisionInput.value
              });
              window.setV39GameState({gameSettings:nextSettings},{reason:'field-vision-setting'});
              fieldVisionInput.value = String(nextSettings.fieldVisionBonusTiles);
              window.refreshV39FieldVisionFromGameSettings?.();
            });
            recoveryInput.addEventListener('change',()=>{'''
          if combined_sync not in text:
              if recovery_sync not in text:
                  raise SystemExit('settings sync target not found')
              text = text.replace(recovery_sync, combined_sync, 1)

          event_line = '''  window.addEventListener('v39:game-state-changed',syncRecoverySetting);'''
          event_lines = '''  window.addEventListener('v39:game-state-changed',syncRecoverySetting);
            window.addEventListener('v39:game-state-changed',syncFieldVisionSetting);'''
          if event_lines not in text:
              if event_line not in text:
                  raise SystemExit('settings event target not found')
              text = text.replace(event_line, event_lines, 1)

          text = text.replace(
              '#v39-recovery-wait-percent{width:5em;',
              '#v39-recovery-wait-percent,#v39-field-vision-bonus{width:5em;',
              1
          )

          save.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- frontend/src/components/PhaserMapGeneratorPanel.vue frontend/src/v39/core/v39-save-system.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/components/PhaserMapGeneratorPanel.vue frontend/src/v39/core/v39-save-system.js
            git commit -m "設定画面とフィールド視界設定を連携"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        env:
          VITE_BASE_PATH: /fantasy_Strategy/
        run: npm run build:front

      - name: Copy runtime static files for GitHub Pages
        run: |
          mkdir -p web-vue-dist/assets web-vue-dist/config web-vue-dist/data
          cp -a assets/. web-vue-dist/assets/
          cp -a config/. web-vue-dist/config/
          cp -a data/. web-vue-dist/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-vue-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Pages source: GitHub Actions
