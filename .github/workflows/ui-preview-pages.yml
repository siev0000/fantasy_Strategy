name: UI Preview Pages

on:
  push:
    branches:
      - ui/mobile-responsive-port-20260912
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ui-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate display setting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/PhaserMapGeneratorPanel.vue')
          text = path.read_text(encoding='utf-8')
          start_marker = '  {\n    key: "section_game",'
          end_marker = '  {\n    key: "section_display",'
          start = text.find(start_marker)
          if start >= 0:
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('section_display marker not found after section_game')
              text = text[:start] + text[end:]
          if 'key: "section_game"' in text:
              raise SystemExit('section_game still remains')
          path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- frontend/src/components/PhaserMapGeneratorPanel.vue; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/components/PhaserMapGeneratorPanel.vue
            git commit -m "表示設定側の視界設定重複を削除"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        env:
          VITE_BASE_PATH: /fantasy_Strategy/
        run: npm run build:front

      - name: Copy runtime static files for GitHub Pages
        run: |
          mkdir -p web-vue-dist/assets web-vue-dist/config web-vue-dist/data
          cp -a assets/. web-vue-dist/assets/
          cp -a config/. web-vue-dist/config/
          cp -a data/. web-vue-dist/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-vue-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Pages source: GitHub Actions
