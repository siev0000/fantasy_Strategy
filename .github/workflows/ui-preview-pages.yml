name: UI Preview Pages

on:
  push:
    branches:
      - ui/mobile-responsive-port-20260912
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ui-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply game settings UI fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/PhaserMapGeneratorPanel.vue")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'const displaySettingsFields = computed(() => ([\n  {\n    key: "section_display",\n    kind: "header",\n    label: "表示設定"\n  },',
                  'const displaySettingsFields = computed(() => ([\n  {\n    key: "section_game",\n    kind: "header",\n    label: "ゲーム設定"\n  },'
              ),
              (
                  '  {\n    key: "showHeightNumbers",',
                  '  {\n    key: "section_display",\n    kind: "header",\n    label: "表示設定"\n  },\n  {\n    key: "showHeightNumbers",'
              ),
              (
                  'if (key === "section_display" || key === "section_audio") return;',
                  'if (key === "section_game" || key === "section_display" || key === "section_audio") return;'
              ),
              (
                  '@click="openDisplaySettingsFromQuickMenu">音量/表示設定</button>',
                  '@click="openDisplaySettingsFromQuickMenu">ゲーム設定</button>'
              ),
              (
                  ':show="showSettingsModal"\n      title="表示設定"',
                  ':show="showSettingsModal"\n      title="ゲーム設定"'
              ),
              (
                  'const showSettingsModal = ref(false); // 表示設定モーダル表示',
                  'const showSettingsModal = ref(false); // ゲーム設定モーダル表示'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- frontend/src/components/PhaserMapGeneratorPanel.vue; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/components/PhaserMapGeneratorPanel.vue
            git commit -m "視界設定をゲーム設定画面へ移動"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        env:
          VITE_BASE_PATH: /fantasy_Strategy/
        run: npm run build:front

      - name: Copy runtime static files for GitHub Pages
        run: |
          mkdir -p web-vue-dist/assets web-vue-dist/config web-vue-dist/data
          cp -a assets/. web-vue-dist/assets/
          cp -a config/. web-vue-dist/config/
          cp -a data/. web-vue-dist/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-vue-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Pages source: GitHub Actions
