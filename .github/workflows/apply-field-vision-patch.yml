name: Apply field vision patch

on:
  push:
    branches:
      - ui/mobile-responsive-port-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply field vision patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/mobile-responsive-port-20260912
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # 1) Pure field-visibility / height-LOS module.
          visibility_module = r'''import { getHexNeighborCoords } from "./hex-grid.js";
          import { v39HexRay } from "./v39-combat-ray.js";

          function coordKey(x, y) {
            return `${x},${y}`;
          }

          function toSafeInt(value, fallback = 0) {
            const raw = Number(value);
            return Number.isFinite(raw) ? Math.floor(raw) : fallback;
          }

          export function resolveV39FieldHeightLevel(mapData, x, y) {
            const raw = mapData?.heightLevelMap?.[y]?.[x];
            return Number.isFinite(raw) ? Math.floor(raw) : null;
          }

          // フィールド表示用LOS。目的マス自身は遮蔽物にせず、途中の高度だけを判定する。
          // 始点→終点の視線高度を線形補間し、中間マスがその線より高ければ奥を隠す。
          export function isV39FieldVisionPathClear(mapData, from, to) {
            if (!mapData?.grid || !from || !to) return false;
            const sx = toSafeInt(from.x, Number.NaN);
            const sy = toSafeInt(from.y, Number.NaN);
            const tx = toSafeInt(to.x, Number.NaN);
            const ty = toSafeInt(to.y, Number.NaN);
            if (![sx, sy, tx, ty].every(Number.isFinite)) return false;
            if (sx === tx && sy === ty) return true;

            const sourceHeight = resolveV39FieldHeightLevel(mapData, sx, sy);
            const targetHeight = resolveV39FieldHeightLevel(mapData, tx, ty);
            // 高度データがないマップは従来どおり距離だけで可視化する。
            if (sourceHeight == null || targetHeight == null) return true;

            const ray = v39HexRay(mapData, { x: sx, y: sy }, { x: tx, y: ty });
            if (!ray.length) return false;
            const last = ray[ray.length - 1];
            if (last.x !== tx || last.y !== ty) return false;

            const stepCount = ray.length;
            for (let index = 0; index < stepCount - 1; index += 1) {
              const tile = ray[index];
              const tileHeight = resolveV39FieldHeightLevel(mapData, tile.x, tile.y);
              if (tileHeight == null) continue;
              const progress = (index + 1) / stepCount;
              const sightHeight = sourceHeight + ((targetHeight - sourceHeight) * progress);
              if (tileHeight > sightHeight) return false;
            }
            return true;
          }

          // 指定半径内を候補化したうえで、各マスを始点からの高さLOSで絞り込む。
          // 索敵値や敵発見判定には触れず、フィールドFog/地形表示だけに利用する。
          export function addV39FieldVisionRangeKeys(mapData, sx, sy, range, outSet) {
            if (!mapData?.grid || !(outSet instanceof Set)) return outSet;
            const x = toSafeInt(sx, Number.NaN);
            const y = toSafeInt(sy, Number.NaN);
            if (!Number.isFinite(x) || !Number.isFinite(y)) return outSet;
            if (x < 0 || y < 0 || x >= mapData.w || y >= mapData.h) return outSet;

            const safeRange = Math.max(0, toSafeInt(range, 0));
            const startKey = coordKey(x, y);
            outSet.add(startKey);
            if (safeRange <= 0) return outSet;

            const visited = new Set([startKey]);
            const queue = [{ x, y, d: 0 }];
            while (queue.length) {
              const current = queue.shift();
              if (!current || current.d >= safeRange) continue;
              const neighbors = getHexNeighborCoords(
                mapData.w,
                mapData.h,
                current.x,
                current.y,
                mapData.worldWrapEnabled === true
              );
              for (const next of neighbors) {
                if (visited.has(next.key)) continue;
                visited.add(next.key);
                const distance = current.d + 1;
                if (isV39FieldVisionPathClear(mapData, { x, y }, next)) {
                  outSet.add(next.key);
                }
                if (distance < safeRange) queue.push({ x: next.x, y: next.y, d: distance });
              }
            }
            return outSet;
          }
          '''
          # Strip YAML indentation from embedded module.
          visibility_module = "\n".join(line[10:] if line.startswith("          ") else line for line in visibility_module.splitlines()) + "\n"
          Path("frontend/src/lib/v39-field-visibility.js").write_text(visibility_module, encoding="utf-8")

          # 2) Configurable +2 field-vision setting (0..10).
          config_path = Path("config/player_config_options.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          progress = config.setdefault("ゲーム進行設定", {})
          progress["フィールド視界追加マス"] = {
              "デフォルト": 2,
              "最小": 0,
              "最大": 10,
              "説明": "フィールドで地形を見渡せる範囲に追加するマス数。索敵・敵発見距離には影響せず、高低差による視界遮蔽を受ける。"
          }
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=4) + "\n", encoding="utf-8")

          # 3) Persist/normalize the setting with the existing game settings object.
          settings_path = Path("frontend/src/lib/game-start-settings.js")
          settings = settings_path.read_text(encoding="utf-8")
          settings = replace_once(
              settings,
              'const combatTurnConfig = progressConfig?.["最大戦闘ターン数"] || {};\n',
              'const combatTurnConfig = progressConfig?.["最大戦闘ターン数"] || {};\nconst fieldVisionConfig = progressConfig?.["フィールド視界追加マス"] || {};\n',
              "game settings config"
          )
          settings = replace_once(
              settings,
              'const GAME_START_MAX_COMBAT_TURNS_MAX = Number.isFinite(rawMaxCombatTurns)\n  ? Math.max(GAME_START_MAX_COMBAT_TURNS_MIN, rawMaxCombatTurns)\n  : 99;\n',
              'const GAME_START_MAX_COMBAT_TURNS_MAX = Number.isFinite(rawMaxCombatTurns)\n  ? Math.max(GAME_START_MAX_COMBAT_TURNS_MIN, rawMaxCombatTurns)\n  : 99;\n\nconst rawMinFieldVisionBonus = Math.floor(Number(fieldVisionConfig?.["最小"]));\nconst rawMaxFieldVisionBonus = Math.floor(Number(fieldVisionConfig?.["最大"]));\nconst GAME_START_FIELD_VISION_BONUS_MIN = Number.isFinite(rawMinFieldVisionBonus)\n  ? Math.max(0, rawMinFieldVisionBonus)\n  : 0;\nconst GAME_START_FIELD_VISION_BONUS_MAX = Number.isFinite(rawMaxFieldVisionBonus)\n  ? Math.max(GAME_START_FIELD_VISION_BONUS_MIN, rawMaxFieldVisionBonus)\n  : 10;\n',
              "field vision min max"
          )
          settings = replace_once(
              settings,
              'const GAME_START_DEFAULT_MAX_COMBAT_TURNS = normalizeCombatTurnCount(\n  combatTurnConfig?.["デフォルト"]\n);\n',
              'const GAME_START_DEFAULT_MAX_COMBAT_TURNS = normalizeCombatTurnCount(\n  combatTurnConfig?.["デフォルト"]\n);\n\nfunction normalizeFieldVisionBonusTiles(value) {\n  const raw = Math.floor(Number(value));\n  const fallbackRaw = Math.floor(Number(fieldVisionConfig?.["デフォルト"]));\n  const fallback = Number.isFinite(fallbackRaw)\n    ? fallbackRaw\n    : 2;\n  const base = Number.isFinite(raw) ? raw : fallback;\n  return Math.min(\n    GAME_START_FIELD_VISION_BONUS_MAX,\n    Math.max(GAME_START_FIELD_VISION_BONUS_MIN, base)\n  );\n}\n\nconst GAME_START_DEFAULT_FIELD_VISION_BONUS = normalizeFieldVisionBonusTiles(\n  fieldVisionConfig?.["デフォルト"]\n);\n',
              "field vision normalizer"
          )
          settings = replace_once(
              settings,
              '    npcFactionCount:Math.max(0,Math.min(8,Math.floor(Number(source.npcFactionCount)||0))),\n',
              '    npcFactionCount:Math.max(0,Math.min(8,Math.floor(Number(source.npcFactionCount)||0))),\n    fieldVisionBonusTiles: normalizeFieldVisionBonusTiles(source.fieldVisionBonusTiles),\n',
              "normalized field vision setting"
          )
          settings = replace_once(
              settings,
              '  GAME_START_DEFAULT_MAX_COMBAT_TURNS,\n',
              '  GAME_START_DEFAULT_FIELD_VISION_BONUS,\n  GAME_START_DEFAULT_MAX_COMBAT_TURNS,\n  GAME_START_FIELD_VISION_BONUS_MAX,\n  GAME_START_FIELD_VISION_BONUS_MIN,\n',
              "field vision exports"
          )
          settings = replace_once(
              settings,
              '  GAME_START_TURN_MODE_OPTIONS,\n  normalizeGameStartSettings\n',
              '  GAME_START_TURN_MODE_OPTIONS,\n  normalizeFieldVisionBonusTiles,\n  normalizeGameStartSettings\n',
              "field vision normalizer export"
          )
          settings_path.write_text(settings, encoding="utf-8")

          # 4) Wire only field visibility to +bonus and height LOS. Detection range remains unchanged.
          panel_path = Path("frontend/src/components/PhaserMapGeneratorPanel.vue")
          panel = panel_path.read_text(encoding="utf-8")
          panel = replace_once(
              panel,
              "import { resolveV39UnitMovementStepCost } from '../lib/v39-terrain-traversal.js';\n",
              "import { resolveV39UnitMovementStepCost } from '../lib/v39-terrain-traversal.js';\nimport { addV39FieldVisionRangeKeys } from \"../lib/v39-field-visibility.js\";\n",
              "field visibility import"
          )
          panel = replace_once(
              panel,
              'import { normalizeGameStartSettings } from "../lib/game-start-settings.js";\n',
              'import {\n  GAME_START_FIELD_VISION_BONUS_MAX,\n  GAME_START_FIELD_VISION_BONUS_MIN,\n  normalizeFieldVisionBonusTiles,\n  normalizeGameStartSettings\n} from "../lib/game-start-settings.js";\n',
              "game settings import"
          )

          pattern = re.compile(
              r'function addVisionRangeKeys\(data, sx, sy, range, outSet\) \{.*?\n\}\n\nfunction buildCurrentScoutRangeTileSet\(data\) \{',
              re.S
          )
          replacement = '''function addVisionRangeKeys(data, sx, sy, range, outSet) {
            return addV39FieldVisionRangeKeys(data, sx, sy, range, outSet);
          }

          function resolveFieldVisionBonusTiles() {
            return normalizeFieldVisionBonusTiles(gameStartSettings.value?.fieldVisionBonusTiles);
          }

          function buildCurrentScoutRangeTileSet(data) {'''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          panel, count = pattern.subn(replacement, panel, count=1)
          if count != 1:
              raise SystemExit(f"field visibility function: expected 1 match, got {count}")

          panel = replace_once(
              panel,
              '  if (!data?.grid) return dynamicVisible;\n\n  const v = villageState.value;\n',
              '  if (!data?.grid) return dynamicVisible;\n  const fieldVisionBonus = resolveFieldVisionBonusTiles();\n\n  const v = villageState.value;\n',
              "field vision bonus local"
          )
          panel = replace_once(
              panel,
              '    addVisionRangeKeys(data, v.x, v.y, BASE_VILLAGE_SCOUT_RANGE, dynamicVisible);\n',
              '    addVisionRangeKeys(data, v.x, v.y, BASE_VILLAGE_SCOUT_RANGE + fieldVisionBonus, dynamicVisible);\n',
              "village field vision bonus"
          )
          panel = replace_once(
              panel,
              '    addVisionRangeKeys(data, unit.x, unit.y, resolveUnitVisionRange(unit), dynamicVisible);\n',
              '    addVisionRangeKeys(data, unit.x, unit.y, resolveUnitVisionRange(unit) + fieldVisionBonus, dynamicVisible);\n',
              "unit field vision bonus"
          )

          settings_header = '''  {
            key: "section_display",
            kind: "header",
            label: "表示設定"
          },
          {
            key: "showHeightNumbers",'''
          settings_header = "\n".join(line[10:] if line.startswith("          ") else line for line in settings_header.splitlines())
          settings_with_field = '''  {
            key: "section_display",
            kind: "header",
            label: "表示設定"
          },
          {
            key: "fieldVisionBonusTiles",
            kind: "number",
            label: "フィールド視界追加マス",
            value: gameStartSettings.value?.fieldVisionBonusTiles ?? 2,
            min: GAME_START_FIELD_VISION_BONUS_MIN,
            max: GAME_START_FIELD_VISION_BONUS_MAX,
            step: 1,
            help: "地形を見渡せる範囲だけを追加します。索敵・敵発見距離は広がらず、高低差で遮られます。"
          },
          {
            key: "showHeightNumbers",'''
          settings_with_field = "\n".join(line[10:] if line.startswith("          ") else line for line in settings_with_field.splitlines())
          panel = replace_once(panel, settings_header, settings_with_field, "display settings field")

          panel = replace_once(
              panel,
              '  } else if (key === "showHeightNumbers") showHeightNumbers.value = !!value;\n',
              '  } else if (key === "fieldVisionBonusTiles") {\n    gameStartSettings.value = normalizeGameStartSettings({\n      ...gameStartSettings.value,\n      fieldVisionBonusTiles: value\n    });\n    rebuildVisibleTiles(currentData.value);\n    requestMapRender();\n  } else if (key === "showHeightNumbers") showHeightNumbers.value = !!value;\n',
              "display setting handler"
          )

          # Structural safety: the encounter/detection range formula must remain unchanged.
          required_detection_fragments = [
              'const playerInRange = distance <= playerVisionRange;',
              'visionRange: resolveUnitVisionRange(unit)',
              'return Math.max(0, UNIT_VISION_BASE_RANGE + bonusRange);'
          ]
          for fragment in required_detection_fragments:
              if fragment not in panel:
                  raise SystemExit(f"detection invariant missing: {fragment}")
          panel_path.write_text(panel, encoding="utf-8")

          # 5) Current-spec memo: field view is now wider and height-blocked; detection is unchanged.
          docs_path = Path("docs/現状ゲーム仕様メモ.md")
          docs = docs_path.read_text(encoding="utf-8")
          old = "山・高低差による視界遮蔽は現在行わない。"
          if old not in docs:
              raise SystemExit("spec memo visibility sentence not found")
          docs = docs.replace(
              old,
              "フィールド表示用の視界にはゲーム設定の追加マス（既定+2）を加え、`heightLevelMap` の中間高度が視線より高い場合はその奥を遮蔽する。索敵・敵発見距離は従来の `1 + floor(索敵/75)` のまま広げない。",
              1
          )
          docs_path.write_text(docs, encoding="utf-8")

          # Remove this one-shot workflow from the resulting implementation commit.
          Path(".github/workflows/apply-field-vision-patch.yml").unlink()
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:front

      - name: Verify patch invariants
        shell: bash
        run: |
          grep -F 'fieldVisionBonusTiles' frontend/src/components/PhaserMapGeneratorPanel.vue
          grep -F 'addV39FieldVisionRangeKeys' frontend/src/components/PhaserMapGeneratorPanel.vue
          grep -F 'const playerInRange = distance <= playerVisionRange;' frontend/src/components/PhaserMapGeneratorPanel.vue
          grep -F 'フィールド視界追加マス' config/player_config_options.json

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: extend field vision without extending detection"
          git push origin HEAD:ui/mobile-responsive-port-20260912
